cuda:
    candy:
        description: |
            CUDA toolkit (nvcc, cudart, cuDNN, onnxruntime) stitched into the canonical /usr layout on Fedora and Arch
            Installs the CUDA compiler driver (nvcc), the CUDA runtime/dev
            libraries (cudart, nvrtc, cupti, curand, cccl, cufile), cuDNN, and
            onnxruntime. On Fedora the RPMs land in /usr directly; on Arch the
            post-install tasks symlink the /opt/cuda binaries, headers, and libs
            into the same /usr-rooted paths, so every downstream GPU consumer
            compiles against one layout regardless of distro. Each artifact is a
            real file or library on disk, so its presence is directly verifiable.
        require:
            # NO `layer-nvidia` HERE, DELIBERATELY. This layer is the CUDA TOOLKIT; layer-nvidia
            # is the DRIVER, and the two are different substrates' contracts, so a `require:`
            # between them is a category error rather than an ordering convenience:
            #
            #   POD  the kernel module is host-global. The runtime injects the driver user-space
            #        per container through /etc/cdi/nvidia.yaml, so the image must bake NONE
            #        (layer-cdi's `cdi-no-baked-driver-binaries` fails the build when it does).
            #   VM   the guest owns its kernel and must carry the driver itself.
            #
            # A `require:` is TARGET-BLIND: it pushed the driver into EVERY pod that composes
            # this toolkit, which this layer's own `cuda-drop-driver-userspace` step then
            # stripped again -- leaving layer-nvidia's baked `check:` assertions demanding
            # /usr/bin/nvidia-ctk on an image whose composition deletes it, so no pod bed that
            # composes the toolkit could ever go green (measured:
            #   FAIL check the nvidia-ctk CLI binary lands on /usr/bin [layer-nvidia:4] exists=false
            #   FAIL check nvidia-ctk runs and reports a version        [layer-nvidia:5] exit=127
            # on opencharly/distro-cachyos `check-comfyui-pod`). opencharly/layer-nvidia#25 carries
            # the diagnosis; opencharly/spec#395 records why the plan-scoping mechanisms that
            # would have made the assertion venue-aware were rejected -- `context:` is
            # build|deploy|runtime and pod-vs-VM is not even its axis.
            #
            # The dependency therefore lives where the substrate is known: a VM / NVIDIA box
            # composes `layer-nvidia` ITSELF, at the box level (see opencharly/vm-nvidia). This
            # layer declares only what the toolkit needs to install: ffmpeg's codec libraries.
            - '@github.com/opencharly/layer-ffmpeg:v2026.272.0056'
        env:
            # /usr is correct on Fedora (where CUDA RPMs land in /usr/bin, /usr/lib64,
            # /usr/include). On Arch, extra/cuda installs to /opt/cuda — a
            # post-install symlink task below stitches the canonical /usr/bin/nvcc,
            # /usr/include/cudnn.h, and /usr/lib64/libcudart.so.* paths into place
            # so consumer layers (llama-cpp, vllm, comfyui, jupyter-ml) compile
            # against the same paths regardless of distro.
            CUDA_HOME: "/usr"
        distro:
            arch:
                package:
                    # Arch extra/cuda is a precompiled binary package — full toolkit
                    # (nvcc, cudart, nvrtc, cupti, curand, cccl, cufile) at /opt/cuda.
                    # Arch extra/cudnn is also precompiled; headers land at
                    # /opt/cuda/targets/x86_64-linux/include/. The post-install symlink
                    # task below maps these into /usr-rooted paths.
                    # python-onnxruntime-cpu is in the CachyOS extra repo (pulled
                    # transitively as a dependency); no AUR build needed — the bare
                    # `python-onnxruntime` AUR package fails to build under the
                    # rootless arch-builder stage. The check probe below maps
                    # `onnxruntime` to `python-onnxruntime-cpu` on Arch via
                    # package_map.
                    - cuda
                    - cudnn
                    - python-onnxruntime-cpu
            fedora:
                package:
                    - onnxruntime
                    - libaio-devel
                    - cpio
                    - cuda-nvcc
                    - cuda-cudart-devel
                    - cuda-cudart-static
                    - cuda-nvrtc-devel
                    - cuda-cupti-devel
                    - libcurand-devel
                    # The CCCL (CUDA C++ Core Libraries) headers are named `cccl-devel` in the
                    # repo these packages actually resolve from. This list previously said
                    # `cuda-cccl-devel`, which no enabled repo provides, so every GPU image failed
                    # its dnf transaction. Note the repo split, measured with
                    # `dnf repoquery --whatprovides '*/cuda/std/version'`:
                    #   fedora-multimedia -> cccl-devel-1:13.3.4.2.1-1.fc43
                    #   NVIDIA cuda-fedora43 -> cuda-cccl-13-2-0 (not used here; its gpgcheck
                    #   fails, and nothing else in the list resolves from it either)
                    # `cuda-nvcc` and `cuda-cudart-devel` carry NO cuda/std files, so this line is
                    # load-bearing and must not simply be dropped (opencharly/layer-cuda#7).
                    - cccl-devel
                    - cuda-cudnn
                    - libcufile-devel
                exclude:
                    - "nvidia-driver*"
                repo:
                    # NVIDIA's official CUDA repo for Fedora 43 — CDN-backed, fast.
                    # This is the primary source for the cuda-* RPMs below; negativo17
                    # mirrors the same upstream artifacts but at glacial speed
                    # (single-server, ~24 KB/s on big files like cuda-nvcc 32 MiB).
                    # negativo17 is kept below ONLY for onnxruntime, which is the one
                    # package not available on NVIDIA's repo.
                    # The key is the one the LIVE cuda-fedora43.repo names. NVIDIA rotated
                    # it (D42D0685 -> 1940C73E, "Kitmaker (Fedora 43)") and DELETED the old
                    # URL, so the stale pin 404'd and `rpm --import` failed with
                    # "import read failed(2)" on every GPU image build. That was survivable
                    # only by accident — the cuda-* packages happened to resolve from
                    # fedora-multimedia, so this repo's gpgcheck=1 never had to verify
                    # anything. Re-pin here when NVIDIA rotates again; the repo file itself
                    # is the source of truth for the current key name.
                    - name: cuda-fedora43-x86_64
                      url: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/cuda-fedora43.repo"
                      gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/1940C73E.pub"
                    - name: fedora-multimedia
                      url: "https://negativo17.org/repos/fedora-multimedia.repo"
                      gpgkey: "https://negativo17.org/repos/RPM-GPG-KEY-slaanesh"
        plan:
            - run: |
                command=if [ ! -f /etc/fedora-release ]; then
                  exit 0
                fi
                CUDNN_DIR=$(mktemp -d)
                cd "$CUDNN_DIR"
                if dnf5 download --enable-repo="fedora-multimedia" cuda-cudnn-devel 2>/dev/null; then
                  rpm2cpio cuda-cudnn-devel*.rpm | cpio -idm 2>/dev/null
                  [ -d ./usr/include ] && cp -v ./usr/include/cudnn*.h /usr/include/
                  while IFS= read -r -d '' link; do
                    name=$(basename "$link")
                    versioned=""
                    for v in /usr/lib64/"${name}".*; do
                      if [ -f "$v" ] && ! echo "$v" | grep -q '\.so$'; then
                        versioned="$v"; break
                      fi
                    done
                    [ -n "$versioned" ] && [ ! -e /usr/lib64/"$name" ] && ln -sv "$(basename "$versioned")" /usr/lib64/"$name"
                  done < <(find ./usr/lib64 -maxdepth 1 -name '*.so' -type l -print0 2>/dev/null)
                fi
                cd / && rm -rf "$CUDNN_DIR"
              run_as: root
              command: |
                if [ ! -f /etc/fedora-release ]; then
                  exit 0
                fi
                CUDNN_DIR=$(mktemp -d)
                cd "$CUDNN_DIR"
                if dnf5 download --enable-repo="fedora-multimedia" cuda-cudnn-devel 2>/dev/null; then
                  rpm2cpio cuda-cudnn-devel*.rpm | cpio -idm 2>/dev/null
                  [ -d ./usr/include ] && cp -v ./usr/include/cudnn*.h /usr/include/
                  while IFS= read -r -d '' link; do
                    name=$(basename "$link")
                    versioned=""
                    for v in /usr/lib64/"${name}".*; do
                      if [ -f "$v" ] && ! echo "$v" | grep -q '\.so$'; then
                        versioned="$v"; break
                      fi
                    done
                    [ -n "$versioned" ] && [ ! -e /usr/lib64/"$name" ] && ln -sv "$(basename "$versioned")" /usr/lib64/"$name"
                  done < <(find ./usr/lib64 -maxdepth 1 -name '*.so' -type l -print0 2>/dev/null)
                fi
                cd / && rm -rf "$CUDNN_DIR"
            - run: |
                command=if [ ! -f /etc/arch-release ]; then
                  exit 0
                fi
                # nvcc + cuobjdump + ptxas + nvprof — every binary in /opt/cuda/bin
                for bin in /opt/cuda/bin/*; do
                  [ -e "$bin" ] && ln -sf "$bin" /usr/bin/$(basename "$bin")
                done
                # Headers — cudnn*.h live in /opt/cuda/targets/x86_64-linux/include
                # on the cudnn package, while CUDA's own headers live in
                # /opt/cuda/include. Symlink both into /usr/include.
                # Headers — link EVERY ENTRY of each toolkit include root, not a guessed subset.
                # nvcc computes its default include root RELATIVE to its own executable, and
                # /usr/bin/nvcc is a symlink, so all CUDA headers must be reachable under
                # /usr/include. Enumerating by pattern is what broke this: a `*.h` glob linked the
                # top-level headers but silently dropped (a) the SUBTREES crt/ and cccl/, which
                # killed every build at CMake's enable_language(CUDA) with "crt/host_config.h: No
                # such file or directory", and then (b) the `.hpp` half of the `_functions` family
                # (`vector_functions.hpp` and friends), which killed the very next stage -- both
                # reported on opencharly/layer-cuda#9. Linking every entry needs no extension list
                # to keep in sync and cannot silently miss a file or a subtree again.
                # nvcc resolves its OWN helpers relative to its own executable path. Through the
                # /usr/bin/nvcc symlink that means /usr/<sibling>/ — so the toolkit's sibling TREES
                # must exist at /usr too, not only its files. Without /usr/nvvm, nvcc cannot find its
                # backend compiler at all: "$CICC_PATH/cicc: No such file or directory"
                # (/usr/sbin/../nvvm/bin/cicc), and every CUDA compile dies while PREPROCESSING
                # still succeeds — which is exactly how the check added in #10 stayed green through
                # it. Both halves of that lesson are fixed here.
                for tree in nvvm; do
                  [ -d "/opt/cuda/$tree" ] && [ ! -e "/usr/$tree" ] && ln -sfn "/opt/cuda/$tree" "/usr/$tree"
                done
                for root in /opt/cuda/include /opt/cuda/targets/x86_64-linux/include; do
                  [ -d "$root" ] || continue
                  for entry in "$root"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/include/"$(basename "$entry")"
                  done
                done
                # Libraries: libcudart, libcudnn, libcurand, etc.
                mkdir -p /usr/lib64
                # Enumerate EVERY entry, not a `*.so*` glob. nvcc links the STATIC archives by
                # default (libcudart_static.a, libcudadevrt.a, libculibos.a, ...), and a `.so*`
                # pattern cannot match a `.a` — so the linker failed with "cannot find
                # -lcudart_static: No such file or directory" although the package ships the file
                # (opencharly/layer-cuda#12). Same defect shape as the `*.h` header glob that missed
                # `.hpp`: pattern-matching a directory instead of enumerating it.
                mkdir -p /usr/lib64
                for libdir in /opt/cuda/targets/x86_64-linux/lib /opt/cuda/lib64; do
                  [ -d "$libdir" ] || continue
                  for entry in "$libdir"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/lib64/"$(basename "$entry")"
                  done
                done
              run_as: root
              command: |
                if [ ! -f /etc/arch-release ]; then
                  exit 0
                fi
                # nvcc + cuobjdump + ptxas + nvprof — every binary in /opt/cuda/bin
                for bin in /opt/cuda/bin/*; do
                  [ -e "$bin" ] && ln -sf "$bin" /usr/bin/$(basename "$bin")
                done
                # Headers — cudnn*.h live in /opt/cuda/targets/x86_64-linux/include
                # on the cudnn package, while CUDA's own headers live in
                # /opt/cuda/include. Symlink both into /usr/include.
                # Headers — link EVERY ENTRY of each toolkit include root, not a guessed subset.
                # nvcc computes its default include root RELATIVE to its own executable, and
                # /usr/bin/nvcc is a symlink, so all CUDA headers must be reachable under
                # /usr/include. Enumerating by pattern is what broke this: a `*.h` glob linked the
                # top-level headers but silently dropped (a) the SUBTREES crt/ and cccl/, which
                # killed every build at CMake's enable_language(CUDA) with "crt/host_config.h: No
                # such file or directory", and then (b) the `.hpp` half of the `_functions` family
                # (`vector_functions.hpp` and friends), which killed the very next stage -- both
                # reported on opencharly/layer-cuda#9. Linking every entry needs no extension list
                # to keep in sync and cannot silently miss a file or a subtree again.
                # nvcc resolves its OWN helpers relative to its own executable path. Through the
                # /usr/bin/nvcc symlink that means /usr/<sibling>/ — so the toolkit's sibling TREES
                # must exist at /usr too, not only its files. Without /usr/nvvm, nvcc cannot find its
                # backend compiler at all: "$CICC_PATH/cicc: No such file or directory"
                # (/usr/sbin/../nvvm/bin/cicc), and every CUDA compile dies while PREPROCESSING
                # still succeeds — which is exactly how the check added in #10 stayed green through
                # it. Both halves of that lesson are fixed here.
                for tree in nvvm; do
                  [ -d "/opt/cuda/$tree" ] && [ ! -e "/usr/$tree" ] && ln -sfn "/opt/cuda/$tree" "/usr/$tree"
                done
                for root in /opt/cuda/include /opt/cuda/targets/x86_64-linux/include; do
                  [ -d "$root" ] || continue
                  for entry in "$root"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/include/"$(basename "$entry")"
                  done
                done
                # Libraries: libcudart, libcudnn, libcurand, etc.
                mkdir -p /usr/lib64
                # Enumerate EVERY entry, not a `*.so*` glob. nvcc links the STATIC archives by
                # default (libcudart_static.a, libcudadevrt.a, libculibos.a, ...), and a `.so*`
                # pattern cannot match a `.a` — so the linker failed with "cannot find
                # -lcudart_static: No such file or directory" although the package ships the file
                # (opencharly/layer-cuda#12). Same defect shape as the `*.h` header glob that missed
                # `.hpp`: pattern-matching a directory instead of enumerating it.
                mkdir -p /usr/lib64
                for libdir in /opt/cuda/targets/x86_64-linux/lib /opt/cuda/lib64; do
                  [ -d "$libdir" ] || continue
                  for entry in "$libdir"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/lib64/"$(basename "$entry")"
                  done
                done
            # ── The driver user-space this package PULLS IN must not be baked ────
            # Arch's `cuda` package depends on `opencl-nvidia`, which ships the NVIDIA
            # OpenCL driver library (/usr/lib/libnvidia-opencl.so.620.70.06 + its SONAME
            # links). That library is HOST-COUPLED the same way nvidia-utils' driver
            # user-space is: NVIDIA's CDI create-symlinks hook points each SONAME at the
            # newest versioned copy present in the container, so an image copy newer than
            # the host's kernel driver wins and NVML/OpenCL init fails against a module it
            # does not match. Measured on a cachyos ollama image (host driver 615.78.08):
            # this one file was the last baked driver library left after
            # layer-nvidia's own strip, and it was reported by
            # `nvidia-driver-libs-match-kernel-module` / the mount-info probe as
            # `baked driver library: /usr/lib/libnvidia-opencl.so.620.70.06`.
            #
            # Each installer cleans up after itself, which is why this lives HERE and not
            # only in the nvidia candy: nvidia-utils' files are installed before this
            # stage, opencl-nvidia's are installed by it. The Vulkan/OpenCL ICD JSON stays
            # (it names a SONAME, not a version, so the CDI-created link satisfies it).
            # The cuda package DEPENDS on nvidia-utils on the pac path, so installing it
            # re-extracts the WHOLE host-coupled driver user-space that the nvidia candy's
            # `nvidia-drop-driver-userspace` step had already removed -- not just
            # opencl-nvidia's share. Measured on CachyOS: host kernel module 615.78.08 vs a
            # baked userspace 620.70.06 (the repo had moved ahead of the installed driver),
            # after which the NVIDIA CDI `create-symlinks` hook pointed `libnvidia-ml.so.1`
            # at the baked NEWER file, `nvidia-smi` exited 18 ("Driver/library version
            # mismatch") and ollama's free-VRAM estimate yielded nothing usable, so inference
            # silently offloaded 0/29 layers and ran on CPU. opencharly/layer-cuda#21.
            #
            # The installer that pulls the files in cleans up after itself, which is why this
            # lives HERE and not only in the nvidia candy: this stage is what reinstalls them.
            # layer-cuda#23: the pattern set was a PREFIX glob, `libcuda*.so*`, and that
            # prefix family is not the driver's -- it also contains `libcudart*` and
            # `libcudadevrt*`, i.e. the CUDA RUNTIME this layer exists to install. Measured
            # on a built image (ghcr.io/opencharly/nvidia-cdi-layer-cuda, check-comfyui-pod
            # 2026.323.0032), after this step had run:
            #   /opt/cuda/lib64/libcudart.so, .so.13, .so.13.5.37   the stitch SOURCE, intact
            #   /usr/lib64/libcudart_static.a                       the only cudart file left
            #   /usr/lib64/libcudart.so*                            gone -- `ls` exits 2
            # so the layer's own `ls /usr/lib64/libcudart.so*` check could never pass. The
            # set is anchored to the DRIVER names now -- `libcuda.so*`, not `libcuda*` --
            # plus `libcudadebugger.so*`, which IS driver user-space but does not carry the
            # `libcuda.so` stem (it is in the CDI spec's injected set) -- and the step now asserts
            # what it KEEPS, not only what it deletes: every CUDA runtime/compute library that
            # was present before the strip must still be present after it, or the build fails
            # naming the file it killed.
            - run: drop the driver user-space the cuda package reinstalls through nvidia-utils, so the CDI mount is its only provider
              id: cuda-drop-driver-userspace
              run_as: root
              command: |
                set -eu
                # ── THE PATTERN SET IS THE DRIVER USER-SPACE, AND NOTHING ELSE ──────────
                # The three families that share a directory in this image (measured, see the
                # comment block above):
                #   DRIVER   libcuda.so{,.1,.<ver>}  libcudadebugger.so{,.1,.<ver>}  libnvidia-*.so*  ...
                #   RUNTIME  libcudart.so{,.13,.13.5.37}  libcudart_static.a  libcudadevrt.a
                #   COMPUTE  libcublas*, libcudnn*, libnvrtc*, libcurand*, libcufft*, ...
                # The strip may only ever delete the FIRST family. A PREFIX glob cannot say
                # that: `libcuda*` matches every member of the "libcuda" prefix family --
                # libcuda.so*, libcudart*, libcudadebugger*, libcudadevrt* -- so it deleted
                # the runtime this very layer installs and stitched, and the layer's own
                # `ls /usr/lib64/libcudart.so*` check then exited 2 (layer-cuda#23).
                # The `.` anchors it: `libcuda.so*` is the driver and only the driver.
                #
                # `libcudadebugger.so*` is listed EXPLICITLY because it is also driver
                # user-space -- the NVIDIA CDI spec injects /usr/lib/libcudadebugger.so.<ver>
                # (measured: /etc/cdi/nvidia.yaml, `nvidia-ctk cdi generate`), so a baked copy
                # is host-coupled in exactly the way this step exists to prevent -- but it
                # does not carry the `libcuda.so` stem, so anchoring alone would leave it
                # behind. `libnvidia-*` covers nvidia-ml, eglcore, glcore, encode, ptxjitcompiler
                # and the rest of the injected set; the tree and xorg removals below cover the
                # three surfaces that are not top-level libraries.
                #
                # ONE definition, used by the delete, by the residue re-check AND by nothing else: three
                # copies of a predicate is how the over-broad glob got in and stayed in.
                #
                # `set -f` is load-bearing. $drv is expanded UNQUOTED -- that is how the -o
                # chain is spliced into the find(1) expression -- and without it the shell
                # would pathname-expand `libcuda.so*` against the CURRENT DIRECTORY before
                # find ever saw it.
                set -f
                drv="-name libnvidia-*.so* -o -name libcuda.so* -o -name libcudadebugger.so* \
                -o -name libnvcuvid.so* -o -name libnvoptix.so* -o -name libGLX_nvidia.so* \
                -o -name libEGL_nvidia.so* -o -name libGLESv1_CM_nvidia.so* \
                -o -name libGLESv2_nvidia.so*"
                # Overridable so the step can be EXECUTED against a fixture -- that is how its
                # discriminating power is proven without a GPU and without an image build
                # (same device layer-cdi's build assertion uses).
                libs=${CUDA_STRIP_LIB_DIRS:-/usr/lib /usr/lib64}
                bins=${CUDA_STRIP_BIN_DIRS:-/usr/bin /usr/local/bin /usr/sbin}

                # THE BASELINE. Snapshot every shared library AND static archive present BEFORE
                # the strip (the toolkit ships libcudart_static.a and libcudadevrt.a beside the
                # .so family, and a bare-prefix regression takes them too). The survival
                # assertion below judges the strip against it, and it is taken BEFORE the
                # deletion on purpose: a post-hoc search of the directory would find the file
                # already gone and could never judge it.
                before=$(mktemp)
                for d in $libs; do
                  if [ ! -d "$d" ] || [ -L "$d" ]; then continue; fi
                  find "$d" -maxdepth 1 \( -type f -o -type l \) \( -name '*.so*' -o -name '*.a' \) 2>/dev/null || true
                done | sort > "$before"

                removed=0
                for d in $libs; do
                  if [ ! -d "$d" ] || [ -L "$d" ]; then continue; fi
                  out=$(find "$d" -maxdepth 1 \( $drv \) -print -delete 2>/dev/null || true)
                  n=$(printf '%s\n' "$out" | grep -c . || true)
                  removed=$((removed + n))
                done
                rm -rf /usr/lib/nvidia /usr/lib/vdpau /usr/lib/xorg/modules/drivers/nvidia_drv.so
                echo "dropped $removed driver library file(s) plus the xorg/vdpau driver trees"

                # THE SURVIVAL ASSERTION -- the control this step was missing. It proved what
                # it DELETED (the residue count below) and never what it must KEEP, so an
                # over-broad pattern could delete the CUDA runtime this layer just stitched
                # and every build-time control still passed; the check that notices
                # (`ls /usr/lib64/libcudart.so*`) runs a stage later, in another repo's plan
                # (layer-cuda#23). The judge is the set of libraries THIS layer installs --
                # not the driver pattern set, which would make the test a tautology: a library
                # from that set that existed before the strip and is gone after it means the
                # pattern set is over-broad, and it is named and failed HERE. The names are
                # prefix-matched rather than `.so`-matched so the static archives
                # (`libcudart_static.a`, `libcudadevrt.a`, `libcublas_static.a`, ...) are
                # inside the guard, not beside it.
                killed=0
                while IFS= read -r p; do
                  if [ -e "$p" ] || [ -L "$p" ]; then continue; fi
                  case "$(basename "$p")" in
                    libcudart*|libcudadevrt*|libnvrtc*|libcublas*|libcudnn*|libnvJitLink*|libcurand*|libcufft*|libcusparse*|libcusolver*|libnccl*)
                      echo "STRIP DELETED A CUDA RUNTIME/COMPUTE LIBRARY: $p"
                      killed=$((killed + 1)) ;;
                  esac
                done < "$before"
                rm -f "$before"
                echo "CUDA runtime/compute libraries the strip deleted: $killed (must be 0)"
                test "$killed" -eq 0 || exit 1
                # The BINARIES are host-coupled in exactly the same way, and the CDI injection
                # mounts them too (measured in a live pod: nvidia-smi, nvidia-cuda-mps-control,
                # nvidia-cuda-mps-server, nvidia-debugdump, nvidia-persistenced, nvidia-xconfig
                # are all bind-mounted from the host). A baked copy is a second, wrong-version
                # one, and for nvidia-smi it is actively misleading: it reports on the image's
                # own libraries instead of the ones injected with the running driver.
                #
                # This deletes the WHOLE `nvidia*` set rather than a hand-listed subset. A
                # subset is how this step first shipped and its own assertion caught three
                # leftovers it had missed (nvidia-container-toolkit and its two
                # nvidia-container-runtime.<variant> wrappers) -- because the package also
                # ships nvidia-ngx-updater, nvidia-pcc, nvidia-powerd and nvidia-sleep.sh, and
                # a list that has to be right about every one of them will be wrong again.
                # None of them belong in an image: the NVIDIA CONTAINER TOOLKIT is HOST
                # tooling -- it generates the CDI spec and lives on the operator's machine --
                # so an image copy is a second, drifting one that nothing runs. This is also
                # the canonical POD strip: layer-cdi deliberately keeps its own copy out
                # (`cdi-no-baked-driver-binaries` only ASSERTS), which is why leaving the
                # binary in place is not an option here -- a pod image that carries
                # nvidia-ctk fails that assertion. The driver layer is therefore not a
                # dependency of this one at all: which substrate supplies the driver is the
                # BOX's decision, and a VM / NVIDIA box composes it itself (opencharly/vm-nvidia).
                # The diagnosis of the alternative -- a venue-aware plan scope that would let a
                # baked check declare itself inapplicable to a composition that strips its
                # subject -- is in this repo's `require:` comment above.
                binned=0
                for d in $bins; do
                  if [ ! -d "$d" ]; then continue; fi
                  out=$(find "$d" -maxdepth 1 \( -type f -o -type l \) -name 'nvidia*' \
                        -print -delete 2>/dev/null || true)
                  n=$(printf '%s\n' "$out" | grep -c . || true)
                  binned=$((binned + n))
                done
                echo "dropped $binned host-coupled nvidia binary/binaries"
                left=0
                for d in $libs; do
                  if [ ! -d "$d" ] || [ -L "$d" ]; then continue; fi
                  n=$(find "$d" -maxdepth 1 \( -type f -o -type l \) \( $drv \) 2>/dev/null | wc -l)
                  left=$((left + n))
                done
                bleft=0
                for d in $bins; do
                  if [ ! -d "$d" ]; then continue; fi
                  n=$(find "$d" -maxdepth 1 \( -type f -o -type l \) -name 'nvidia*' 2>/dev/null | wc -l)
                  bleft=$((bleft + n))
                done
                echo "driver library files still baked after the strip: $left"
                echo "host-coupled nvidia binaries still baked after the strip: $bleft"
                test "$left" -eq 0 || exit 1
                test "$bleft" -eq 0 || exit 1
            - check: the nvcc CUDA compiler driver is on the canonical /usr path
              file:
                file: /usr/bin/nvcc
                exists: true
            - check: nvcc reports its CUDA compilation-tools release
              exit_status: 0
              stdout:
                - contains: release
              command: nvcc --version
            - check: the cuDNN header is available at /usr/include regardless of distro
              file:
                file: /usr/include/cudnn.h
                exists: true
            - check: "a CUDA translation unit COMPILES AND LINKS against the stitched /usr layout (Arch: the header subtrees are linked, not only the top-level files)"
              id: cuda-arch-header-root
              # Scoped IN THE COMMAND deliberately: the check runner does not honour runner-level
              # exclude-distro fields, and Fedora's RPMs land in /usr directly so its layout differs.
              #
              # This is the probe the plan was missing. `nvcc --version` proves nvcc RUNS and the
              # cuDNN probe proves one top-level header arrived -- but neither can FAIL on a layout
              # that cannot compile, which is how `crt/` stayed unlinked while every probe passed:
              # nvcc computes its include root relative to its own (symlinked) executable, so
              # cuda_runtime.h's `#include "crt/host_config.h"` resolved under /usr/include and was
              # not there. Reproduced end to end on real Arch hardware (opencharly/layer-cuda#9).
              command: |
                [ -f /etc/arch-release ] || exit 0
                test -f /usr/include/crt/host_config.h || exit 1
                printf 'int main(void){return 0;}\n' > /tmp/chkcuda.cu
                nvcc -x cu -o /tmp/chkcuda /tmp/chkcuda.cu
                rc=$?
                rm -f /tmp/chkcuda.cu
                exit $rc
            - check: the CUDA runtime library is linkable from the canonical /usr/lib64 path
              exit_status: 0
              command: ls /usr/lib64/libcudart.so*
            - agent-check: downstream GPU layers (llama-cpp, vllm, comfyui, jupyter-ml) compile against the same /usr-rooted CUDA layout on both Fedora and Arch
            - check: package=cuda-cudart-devel
              id: cuda-cudart-package
              package:
                package: cuda-cudart-devel
                package_map:
                    arch: cuda
                    fedora: cuda-cudart-devel
                installed: true
            - check: command=ls /usr/include/cudnn.h
              id: cudnn-header
              exit_status: 0
              command: ls /usr/include/cudnn.h
            - check: package=onnxruntime
              id: onnxruntime-package
              package:
                package: onnxruntime
                package_map:
                    arch: python-onnxruntime-cpu
                    fedora: onnxruntime
                installed: true

cuda-skill:
    skill:
        name: cuda
        family: distros
        owner: cuda
        description: |-
            CUDA toolkit, cuDNN, ONNX Runtime, and NVIDIA GPU development libraries from the NVIDIA
            CUDA repo plus negativo17 on Fedora, and from the Arch repos on Arch/CachyOS.
            Carries NO driver dependency: a pod takes its driver from the host through the CDI spec,
            and a VM box composes the driver layer itself, at the box level. Use when working with
            GPU computing, CUDA, cuDNN, machine learning infrastructure, or NVIDIA development tools.
