cuda:
    candy:
        description: |
            CUDA toolkit (nvcc, cudart, cuDNN, onnxruntime) stitched into the canonical /usr layout on Fedora and Arch
            Installs the CUDA compiler driver (nvcc), the CUDA runtime/dev
            libraries (cudart, nvrtc, cupti, curand, cccl, cufile), cuDNN, and
            onnxruntime. On Fedora the RPMs land in /usr directly; on Arch the
            post-install tasks symlink the /opt/cuda binaries, headers, and libs
            into the same /usr-rooted paths, so every downstream GPU consumer
            compiles against one layout regardless of distro. Each artifact is a
            real file or library on disk, so its presence is directly verifiable.
        require:
            - '@github.com/opencharly/layer-nvidia:7766a9d06ec5fe8c276c091a68fb72cea12688e3'
            - '@github.com/opencharly/layer-ffmpeg:v2026.272.0056'
        env:
            # /usr is correct on Fedora (where CUDA RPMs land in /usr/bin, /usr/lib64,
            # /usr/include). On Arch, extra/cuda installs to /opt/cuda — a
            # post-install symlink task below stitches the canonical /usr/bin/nvcc,
            # /usr/include/cudnn.h, and /usr/lib64/libcudart.so.* paths into place
            # so consumer layers (llama-cpp, vllm, comfyui, jupyter-ml) compile
            # against the same paths regardless of distro.
            CUDA_HOME: "/usr"
        distro:
            arch:
                package:
                    # Arch extra/cuda is a precompiled binary package — full toolkit
                    # (nvcc, cudart, nvrtc, cupti, curand, cccl, cufile) at /opt/cuda.
                    # Arch extra/cudnn is also precompiled; headers land at
                    # /opt/cuda/targets/x86_64-linux/include/. The post-install symlink
                    # task below maps these into /usr-rooted paths.
                    # python-onnxruntime-cpu is in the CachyOS extra repo (pulled
                    # transitively as a dependency); no AUR build needed — the bare
                    # `python-onnxruntime` AUR package fails to build under the
                    # rootless arch-builder stage. The check probe below maps
                    # `onnxruntime` to `python-onnxruntime-cpu` on Arch via
                    # package_map.
                    - cuda
                    - cudnn
                    - python-onnxruntime-cpu
            fedora:
                package:
                    - onnxruntime
                    - libaio-devel
                    - cpio
                    - cuda-nvcc
                    - cuda-cudart-devel
                    - cuda-cudart-static
                    - cuda-nvrtc-devel
                    - cuda-cupti-devel
                    - libcurand-devel
                    # The CCCL (CUDA C++ Core Libraries) headers are named `cccl-devel` in the
                    # repo these packages actually resolve from. This list previously said
                    # `cuda-cccl-devel`, which no enabled repo provides, so every GPU image failed
                    # its dnf transaction. Note the repo split, measured with
                    # `dnf repoquery --whatprovides '*/cuda/std/version'`:
                    #   fedora-multimedia -> cccl-devel-1:13.3.4.2.1-1.fc43
                    #   NVIDIA cuda-fedora43 -> cuda-cccl-13-2-0 (not used here; its gpgcheck
                    #   fails, and nothing else in the list resolves from it either)
                    # `cuda-nvcc` and `cuda-cudart-devel` carry NO cuda/std files, so this line is
                    # load-bearing and must not simply be dropped (opencharly/layer-cuda#7).
                    - cccl-devel
                    - cuda-cudnn
                    - libcufile-devel
                exclude:
                    - "nvidia-driver*"
                repo:
                    # NVIDIA's official CUDA repo for Fedora 43 — CDN-backed, fast.
                    # This is the primary source for the cuda-* RPMs below; negativo17
                    # mirrors the same upstream artifacts but at glacial speed
                    # (single-server, ~24 KB/s on big files like cuda-nvcc 32 MiB).
                    # negativo17 is kept below ONLY for onnxruntime, which is the one
                    # package not available on NVIDIA's repo.
                    # The key is the one the LIVE cuda-fedora43.repo names. NVIDIA rotated
                    # it (D42D0685 -> 1940C73E, "Kitmaker (Fedora 43)") and DELETED the old
                    # URL, so the stale pin 404'd and `rpm --import` failed with
                    # "import read failed(2)" on every GPU image build. That was survivable
                    # only by accident — the cuda-* packages happened to resolve from
                    # fedora-multimedia, so this repo's gpgcheck=1 never had to verify
                    # anything. Re-pin here when NVIDIA rotates again; the repo file itself
                    # is the source of truth for the current key name.
                    - name: cuda-fedora43-x86_64
                      url: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/cuda-fedora43.repo"
                      gpgkey: "https://developer.download.nvidia.com/compute/cuda/repos/fedora43/x86_64/1940C73E.pub"
                    - name: fedora-multimedia
                      url: "https://negativo17.org/repos/fedora-multimedia.repo"
                      gpgkey: "https://negativo17.org/repos/RPM-GPG-KEY-slaanesh"
        plan:
            - run: |
                command=if [ ! -f /etc/fedora-release ]; then
                  exit 0
                fi
                CUDNN_DIR=$(mktemp -d)
                cd "$CUDNN_DIR"
                if dnf5 download --enable-repo="fedora-multimedia" cuda-cudnn-devel 2>/dev/null; then
                  rpm2cpio cuda-cudnn-devel*.rpm | cpio -idm 2>/dev/null
                  [ -d ./usr/include ] && cp -v ./usr/include/cudnn*.h /usr/include/
                  while IFS= read -r -d '' link; do
                    name=$(basename "$link")
                    versioned=""
                    for v in /usr/lib64/"${name}".*; do
                      if [ -f "$v" ] && ! echo "$v" | grep -q '\.so$'; then
                        versioned="$v"; break
                      fi
                    done
                    [ -n "$versioned" ] && [ ! -e /usr/lib64/"$name" ] && ln -sv "$(basename "$versioned")" /usr/lib64/"$name"
                  done < <(find ./usr/lib64 -maxdepth 1 -name '*.so' -type l -print0 2>/dev/null)
                fi
                cd / && rm -rf "$CUDNN_DIR"
              run_as: root
              command: |
                if [ ! -f /etc/fedora-release ]; then
                  exit 0
                fi
                CUDNN_DIR=$(mktemp -d)
                cd "$CUDNN_DIR"
                if dnf5 download --enable-repo="fedora-multimedia" cuda-cudnn-devel 2>/dev/null; then
                  rpm2cpio cuda-cudnn-devel*.rpm | cpio -idm 2>/dev/null
                  [ -d ./usr/include ] && cp -v ./usr/include/cudnn*.h /usr/include/
                  while IFS= read -r -d '' link; do
                    name=$(basename "$link")
                    versioned=""
                    for v in /usr/lib64/"${name}".*; do
                      if [ -f "$v" ] && ! echo "$v" | grep -q '\.so$'; then
                        versioned="$v"; break
                      fi
                    done
                    [ -n "$versioned" ] && [ ! -e /usr/lib64/"$name" ] && ln -sv "$(basename "$versioned")" /usr/lib64/"$name"
                  done < <(find ./usr/lib64 -maxdepth 1 -name '*.so' -type l -print0 2>/dev/null)
                fi
                cd / && rm -rf "$CUDNN_DIR"
            - run: |
                command=if [ ! -f /etc/arch-release ]; then
                  exit 0
                fi
                # nvcc + cuobjdump + ptxas + nvprof — every binary in /opt/cuda/bin
                for bin in /opt/cuda/bin/*; do
                  [ -e "$bin" ] && ln -sf "$bin" /usr/bin/$(basename "$bin")
                done
                # Headers — cudnn*.h live in /opt/cuda/targets/x86_64-linux/include
                # on the cudnn package, while CUDA's own headers live in
                # /opt/cuda/include. Symlink both into /usr/include.
                # Headers — link EVERY ENTRY of each toolkit include root, not a guessed subset.
                # nvcc computes its default include root RELATIVE to its own executable, and
                # /usr/bin/nvcc is a symlink, so all CUDA headers must be reachable under
                # /usr/include. Enumerating by pattern is what broke this: a `*.h` glob linked the
                # top-level headers but silently dropped (a) the SUBTREES crt/ and cccl/, which
                # killed every build at CMake's enable_language(CUDA) with "crt/host_config.h: No
                # such file or directory", and then (b) the `.hpp` half of the `_functions` family
                # (`vector_functions.hpp` and friends), which killed the very next stage -- both
                # reported on opencharly/layer-cuda#9. Linking every entry needs no extension list
                # to keep in sync and cannot silently miss a file or a subtree again.
                # nvcc resolves its OWN helpers relative to its own executable path. Through the
                # /usr/bin/nvcc symlink that means /usr/<sibling>/ — so the toolkit's sibling TREES
                # must exist at /usr too, not only its files. Without /usr/nvvm, nvcc cannot find its
                # backend compiler at all: "$CICC_PATH/cicc: No such file or directory"
                # (/usr/sbin/../nvvm/bin/cicc), and every CUDA compile dies while PREPROCESSING
                # still succeeds — which is exactly how the check added in #10 stayed green through
                # it. Both halves of that lesson are fixed here.
                for tree in nvvm; do
                  [ -d "/opt/cuda/$tree" ] && [ ! -e "/usr/$tree" ] && ln -sfn "/opt/cuda/$tree" "/usr/$tree"
                done
                for root in /opt/cuda/include /opt/cuda/targets/x86_64-linux/include; do
                  [ -d "$root" ] || continue
                  for entry in "$root"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/include/"$(basename "$entry")"
                  done
                done
                # Libraries: libcudart, libcudnn, libcurand, etc.
                mkdir -p /usr/lib64
                # Enumerate EVERY entry, not a `*.so*` glob. nvcc links the STATIC archives by
                # default (libcudart_static.a, libcudadevrt.a, libculibos.a, ...), and a `.so*`
                # pattern cannot match a `.a` — so the linker failed with "cannot find
                # -lcudart_static: No such file or directory" although the package ships the file
                # (opencharly/layer-cuda#12). Same defect shape as the `*.h` header glob that missed
                # `.hpp`: pattern-matching a directory instead of enumerating it.
                mkdir -p /usr/lib64
                for libdir in /opt/cuda/targets/x86_64-linux/lib /opt/cuda/lib64; do
                  [ -d "$libdir" ] || continue
                  for entry in "$libdir"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/lib64/"$(basename "$entry")"
                  done
                done
              run_as: root
              command: |
                if [ ! -f /etc/arch-release ]; then
                  exit 0
                fi
                # nvcc + cuobjdump + ptxas + nvprof — every binary in /opt/cuda/bin
                for bin in /opt/cuda/bin/*; do
                  [ -e "$bin" ] && ln -sf "$bin" /usr/bin/$(basename "$bin")
                done
                # Headers — cudnn*.h live in /opt/cuda/targets/x86_64-linux/include
                # on the cudnn package, while CUDA's own headers live in
                # /opt/cuda/include. Symlink both into /usr/include.
                # Headers — link EVERY ENTRY of each toolkit include root, not a guessed subset.
                # nvcc computes its default include root RELATIVE to its own executable, and
                # /usr/bin/nvcc is a symlink, so all CUDA headers must be reachable under
                # /usr/include. Enumerating by pattern is what broke this: a `*.h` glob linked the
                # top-level headers but silently dropped (a) the SUBTREES crt/ and cccl/, which
                # killed every build at CMake's enable_language(CUDA) with "crt/host_config.h: No
                # such file or directory", and then (b) the `.hpp` half of the `_functions` family
                # (`vector_functions.hpp` and friends), which killed the very next stage -- both
                # reported on opencharly/layer-cuda#9. Linking every entry needs no extension list
                # to keep in sync and cannot silently miss a file or a subtree again.
                # nvcc resolves its OWN helpers relative to its own executable path. Through the
                # /usr/bin/nvcc symlink that means /usr/<sibling>/ — so the toolkit's sibling TREES
                # must exist at /usr too, not only its files. Without /usr/nvvm, nvcc cannot find its
                # backend compiler at all: "$CICC_PATH/cicc: No such file or directory"
                # (/usr/sbin/../nvvm/bin/cicc), and every CUDA compile dies while PREPROCESSING
                # still succeeds — which is exactly how the check added in #10 stayed green through
                # it. Both halves of that lesson are fixed here.
                for tree in nvvm; do
                  [ -d "/opt/cuda/$tree" ] && [ ! -e "/usr/$tree" ] && ln -sfn "/opt/cuda/$tree" "/usr/$tree"
                done
                for root in /opt/cuda/include /opt/cuda/targets/x86_64-linux/include; do
                  [ -d "$root" ] || continue
                  for entry in "$root"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/include/"$(basename "$entry")"
                  done
                done
                # Libraries: libcudart, libcudnn, libcurand, etc.
                mkdir -p /usr/lib64
                # Enumerate EVERY entry, not a `*.so*` glob. nvcc links the STATIC archives by
                # default (libcudart_static.a, libcudadevrt.a, libculibos.a, ...), and a `.so*`
                # pattern cannot match a `.a` — so the linker failed with "cannot find
                # -lcudart_static: No such file or directory" although the package ships the file
                # (opencharly/layer-cuda#12). Same defect shape as the `*.h` header glob that missed
                # `.hpp`: pattern-matching a directory instead of enumerating it.
                mkdir -p /usr/lib64
                for libdir in /opt/cuda/targets/x86_64-linux/lib /opt/cuda/lib64; do
                  [ -d "$libdir" ] || continue
                  for entry in "$libdir"/*; do
                    [ -e "$entry" ] || continue
                    ln -sfn "$entry" /usr/lib64/"$(basename "$entry")"
                  done
                done
            - check: the nvcc CUDA compiler driver is on the canonical /usr path
              file:
                file: /usr/bin/nvcc
                exists: true
            - check: nvcc reports its CUDA compilation-tools release
              exit_status: 0
              stdout:
                - contains: release
              command: nvcc --version
            - check: the cuDNN header is available at /usr/include regardless of distro
              file:
                file: /usr/include/cudnn.h
                exists: true
            - check: "a CUDA translation unit COMPILES AND LINKS against the stitched /usr layout (Arch: the header subtrees are linked, not only the top-level files)"
              id: cuda-arch-header-root
              # Scoped IN THE COMMAND deliberately: the check runner does not honour runner-level
              # exclude-distro fields, and Fedora's RPMs land in /usr directly so its layout differs.
              #
              # This is the probe the plan was missing. `nvcc --version` proves nvcc RUNS and the
              # cuDNN probe proves one top-level header arrived -- but neither can FAIL on a layout
              # that cannot compile, which is how `crt/` stayed unlinked while every probe passed:
              # nvcc computes its include root relative to its own (symlinked) executable, so
              # cuda_runtime.h's `#include "crt/host_config.h"` resolved under /usr/include and was
              # not there. Reproduced end to end on real Arch hardware (opencharly/layer-cuda#9).
              command: |
                [ -f /etc/arch-release ] || exit 0
                test -f /usr/include/crt/host_config.h || exit 1
                printf 'int main(void){return 0;}\n' > /tmp/chkcuda.cu
                nvcc -x cu -o /tmp/chkcuda /tmp/chkcuda.cu
                rc=$?
                rm -f /tmp/chkcuda.cu
                exit $rc
            - check: the CUDA runtime library is linkable from the canonical /usr/lib64 path
              exit_status: 0
              command: ls /usr/lib64/libcudart.so*
            - agent-check: downstream GPU layers (llama-cpp, vllm, comfyui, jupyter-ml) compile against the same /usr-rooted CUDA layout on both Fedora and Arch
            - check: package=cuda-cudart-devel
              id: cuda-cudart-package
              package:
                package: cuda-cudart-devel
                package_map:
                    arch: cuda
                    fedora: cuda-cudart-devel
                installed: true
            - check: command=ls /usr/include/cudnn.h
              id: cudnn-header
              exit_status: 0
              command: ls /usr/include/cudnn.h
            - check: package=onnxruntime
              id: onnxruntime-package
              package:
                package: onnxruntime
                package_map:
                    arch: python-onnxruntime-cpu
                    fedora: onnxruntime
                installed: true

cuda-skill:
    skill:
        name: cuda
        family: distros
        owner: cuda
        description: |-
            CUDA toolkit, cuDNN, ONNX Runtime, and NVIDIA GPU development libraries from negativo17 repos.
            Depends on the nvidia candy for runtime support. Use when working with GPU computing, CUDA,
            cuDNN, machine learning infrastructure, or NVIDIA development tools.
